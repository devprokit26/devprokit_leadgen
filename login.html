<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Gloves Lead Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#f4f7fb;color:#0f172a}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}
@keyframes shine{to{background-position:200% 0}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.l{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:center;color:#fff;background:linear-gradient(135deg,#0b1220,#0f766e 75%,#0891b2)}
.l:before,.l:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 10s ease-in-out infinite}
.l:before{width:340px;height:340px;background:#2dd4bf;right:-80px;top:-100px}.l:after{width:280px;height:280px;background:#38bdf8;left:-60px;bottom:-90px;animation-delay:-5s}
.l>*{position:relative;animation:up .7s both}.l h1{margin:0 0 14px;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-1.2px;animation-delay:.1s}
.l p{margin:0 0 30px;max-width:440px;color:#cdeeea;font-size:16px;line-height:1.65;animation-delay:.2s}
.lg{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;margin-bottom:46px}.lg i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14b8a6,#0891b2);display:grid;place-items:center;font-style:normal;font-size:21px}
.f{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:15px;color:#e6fffb}.f b{width:30px;height:30px;border-radius:9px;background:#ffffff1f;display:grid;place-items:center;font-size:14px;backdrop-filter:blur(6px)}
.f:nth-of-type(1){animation-delay:.3s}.f:nth-of-type(2){animation-delay:.4s}.f:nth-of-type(3){animation-delay:.5s}
.r{display:grid;place-items:center;padding:30px}
.c{width:100%;max-width:380px;animation:up .7s .15s both}.c h2{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.6px}.c .s{margin:0 0 26px;color:#64748b;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#334155}
input{width:100%;padding:13px 14px;margin-bottom:16px;border:1px solid #d5dce6;border-radius:12px;font-size:15px;font-family:inherit;background:#fff;transition:.2s}
input:focus{outline:0;border-color:#14b8a6;box-shadow:0 0 0 4px #14b8a622;transform:translateY(-1px)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(110deg,#0d9488,#14b8a6,#0891b2,#0d9488);background-size:250% 100%;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;animation:shine 6s linear infinite;box-shadow:0 10px 24px #0d948855;transition:.25s}
button:hover{transform:translateY(-2px);box-shadow:0 14px 30px #0d948877}button:disabled{opacity:.65;cursor:wait}
#e{color:#dc2626;font-size:13px;min-height:20px;margin:-4px 0 8px}.sh{animation:shake .4s}
@media(max-width:820px){body{grid-template-columns:1fr}.l{padding:34px 26px}.l h1{font-size:30px}.lg{margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="l"><div class="lg"><i>🧤</i>Gloves Lead Finder</div>
 <h1>Find gloves buyers, faster.</h1><p>Search worldwide, get verified phone, email, owner and social links in one clean report.</p>
 <div class="f"><b>🌍</b>Any country, city or town</div><div class="f"><b>✉</b>Email, phone and owner details</div><div class="f"><b>📄</b>Download Excel or PDF report</div></div>
<div class="r"><div class="c"><h2>Welcome back</h2><div class="s">Sign in to continue to your dashboard</div>
 <label for="u">Username</label><input id="u" placeholder="Enter username" autofocus>
 <label for="p">Password</label><input id="p" type="password" placeholder="Enter password">
 <div id="e"></div><button id="b" onclick="go()">Sign in</button></div></div>
<script>
document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function go(){b.disabled=true;b.textContent='Signing in...';
const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u.value,p:p.value})});
if(r.ok)location.reload();else{b.disabled=false;b.textContent='Sign in';e.textContent='Username ya password ghalat hai';const c=document.querySelector('.c');c.classList.remove('sh');void c.offsetWidth;c.classList.add('sh')}}
</script></body></html>
